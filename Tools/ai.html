<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Chat — KaiOverCooked</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0A0A0A;
  --bg2:      #111111;
  --bg3:      #1A1A1A;
  --bg4:      #242424;
  --line:     rgba(255,255,255,0.07);
  --line2:    rgba(255,255,255,0.12);
  --text:     #F0F0EE;
  --text2:    #888884;
  --text3:    #444440;
  --bubble-u: #1E1E1E;
  --bubble-a: #141414;
  --accent:   #F0F0EE;
  --green:    #44FF88;
}

html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  overflow: hidden;
}

/* grain */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.025; pointer-events: none; z-index: 9999;
}

/* ── Layout ─────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 560px;
  margin: 0 auto;
}

/* ── Header ─────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  background: var(--bg);
  position: relative;
  z-index: 10;
}

.hdr-left { display: flex; align-items: center; gap: 10px; }

.ai-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  position: relative;
  flex-shrink: 0;
}

/* online dot */
.ai-avatar::after {
  content: '';
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  border: 2px solid var(--bg);
  position: absolute;
  bottom: -1px; right: -1px;
  box-shadow: 0 0 6px var(--green);
}

.ai-info {}
.ai-name {
  font-size: 14px; font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.ai-status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.hdr-right { display: flex; gap: 6px; }

.hdr-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.hdr-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--line2); }

/* ── Model selector ─────────────────────────────── */
.model-bar {
  padding: 8px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.model-bar::-webkit-scrollbar { display: none; }

.model-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-right: 2px;
}

.model-chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  flex-shrink: 0;
}
.model-chip:hover { border-color: var(--line2); color: var(--text); }
.model-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

/* ── Chat area ──────────────────────────────────── */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar { width: 3px; }
#chat::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ── Date divider ───────────────────────────────── */
.date-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 0 8px;
}
.date-divider::before, .date-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}
.date-divider span {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase;
}

/* ── Message rows ───────────────────────────────── */
.msg-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  animation: msg-in 0.25s ease both;
}
.msg-row.user { align-items: flex-end; }
.msg-row.ai   { align-items: flex-start; }

@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* Sender label */
.msg-sender {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.1em;
  padding: 0 4px;
  margin-bottom: 2px;
}

/* Bubble */
.bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: -0.005em;
  position: relative;
  word-break: break-word;
}

.user .bubble {
  background: var(--bubble-u);
  border: 1px solid var(--line2);
  border-bottom-right-radius: 4px;
  color: var(--text);
}

.ai .bubble {
  background: var(--bubble-a);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

/* Code block inside bubble */
.bubble pre {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  margin: 8px 0;
  overflow-x: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text2);
}

.bubble code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  background: var(--bg3);
  padding: 1px 5px;
  border-radius: 4px;
  color: var(--text2);
}

/* Timestamp */
.msg-time {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.06em;
  padding: 0 4px;
}

/* ── Typing indicator ───────────────────────────── */
.typing-bubble {
  background: var(--bubble-a);
  border: 1px solid var(--line);
  border-radius: 16px; border-bottom-left-radius: 4px;
  padding: 12px 16px;
  display: flex; gap: 4px; align-items: center;
}
.typing-dot {
  width: 5px; height: 5px;
  background: var(--text3);
  border-radius: 50%;
  animation: typing-bounce 1.2s ease infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.30s; }

@keyframes typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%           { transform: translateY(-4px); opacity: 1; }
}

/* ── Empty state ────────────────────────────────── */
#emptyState {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  height: 100%;
  text-align: center;
  padding: 20px;
}
.empty-icon { font-size: 36px; opacity: 0.2; }
.empty-title {
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.02em; color: var(--text2);
}
.empty-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--text3);
  letter-spacing: 0.08em; line-height: 1.7;
}

/* ── Suggestions ────────────────────────────────── */
.suggestions {
  display: flex; flex-wrap: wrap;
  gap: 6px; justify-content: center;
  margin-top: 4px;
}
.suggestion-chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--line2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
.suggestion-chip:hover {
  background: var(--bg3); color: var(--text);
  border-color: var(--text3);
  transform: translateY(-1px);
}

/* ── Input area ─────────────────────────────────── */
#inputArea {
  padding: 12px 18px 16px;
  border-top: 1px solid var(--line);
  background: var(--bg);
  flex-shrink: 0;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 8px 8px 14px;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--line2); }

#msgInput {
  flex: 1;
  background: none; border: none; outline: none;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  max-height: 120px;
  min-height: 22px;
  scrollbar-width: none;
}
#msgInput::-webkit-scrollbar { display: none; }
#msgInput::placeholder { color: var(--text3); }

.send-btn {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  border: none; cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.send-btn:hover { opacity: 0.85; transform: scale(1.04); }
.send-btn:active { transform: scale(0.96); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

.input-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
  padding: 0 2px;
}
.input-hint {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.08em;
}
.char-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.06em;
}

/* ── Clear confirm ──────────────────────────────── */
.clear-confirm {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 16px;
  padding: 24px;
  z-index: 100;
  width: 260px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.clear-confirm.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: all;
}
.clear-confirm-title {
  font-size: 15px; font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.clear-confirm-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--text3);
  letter-spacing: 0.06em; margin-bottom: 18px;
}
.clear-confirm-btns { display: flex; gap: 8px; }
.cc-btn {
  flex: 1; padding: 8px;
  border-radius: 10px; border: 1px solid var(--line2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; cursor: pointer;
  letter-spacing: 0.06em; transition: all 0.15s;
}
.cc-btn.cancel { background: var(--bg3); color: var(--text2); }
.cc-btn.cancel:hover { color: var(--text); }
.cc-btn.confirm { background: var(--text); color: var(--bg); border-color: transparent; }
.cc-btn.confirm:hover { opacity: 0.85; }

.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.overlay.show { opacity: 1; pointer-events: all; }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="hdr-left">
      <div class="ai-avatar">◈</div>
      <div class="ai-info">
        <div class="ai-name">KaiAI</div>
        <div class="ai-status" id="aiStatus">online · ready</div>
      </div>
    </div>
    <div class="hdr-right">
      <button class="hdr-btn" onclick="showClearConfirm()" title="Clear chat">⊘</button>
      <button class="hdr-btn" onclick="exportChat()" title="Export">↓</button>
    </div>
  </div>

  <!-- Model selector -->
  <div class="model-bar">
    <div class="model-label">model</div>
    <button class="model-chip active" onclick="selectModel(this,'claude')">Claude Sonnet</button>
    <button class="model-chip" onclick="selectModel(this,'haiku')">Claude Haiku</button>
    <button class="model-chip" onclick="selectModel(this,'opus')">Claude Opus</button>
  </div>

  <!-- Chat -->
  <div id="chat">
    <div id="emptyState">
      <div class="empty-icon">◈</div>
      <div class="empty-title">KaiAI</div>
      <div class="empty-sub">powered by Claude · ask anything<br/>type below to start</div>
      <div class="suggestions">
        <div class="suggestion-chip" onclick="useSuggestion(this)">buatkan kode kalkulator</div>
        <div class="suggestion-chip" onclick="useSuggestion(this)">jelaskan cara kerja MIDI</div>
        <div class="suggestion-chip" onclick="useSuggestion(this)">ide project portfolio</div>
        <div class="suggestion-chip" onclick="useSuggestion(this)">roast kode saya</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div id="inputArea">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="ketik sesuatu..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
    <div class="input-footer">
      <div class="input-hint">enter kirim · shift+enter baris baru</div>
      <div class="char-count" id="charCount">0</div>
    </div>
  </div>
</div>

<!-- Clear confirm overlay -->
<div class="overlay" id="overlay" onclick="hideClearConfirm()"></div>
<div class="clear-confirm" id="clearConfirm">
  <div class="clear-confirm-title">Hapus semua chat?</div>
  <div class="clear-confirm-sub">aksi ini tidak bisa diurungkan</div>
  <div class="clear-confirm-btns">
    <button class="cc-btn cancel" onclick="hideClearConfirm()">batal</button>
    <button class="cc-btn confirm" onclick="clearChat()">hapus</button>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────
const chatEl   = document.getElementById('chat');
const input    = document.getElementById('msgInput');
const sendBtn  = document.getElementById('sendBtn');
const charCount = document.getElementById('charCount');
const emptyState = document.getElementById('emptyState');
const aiStatus = document.getElementById('aiStatus');

let messages = []; // {role, content, time}
let isLoading = false;
let selectedModel = 'claude-sonnet-4-20250514';
let typingEl = null;

const MODELS = {
  claude: 'claude-sonnet-4-20250514',
  haiku:  'claude-haiku-4-5-20251001',
  opus:   'claude-sonnet-4-20250514', // fallback
};

const SYSTEM_PROMPT = `Kamu adalah KaiAI, asisten AI milik KaiOverCooked. 
Kamu cerdas, sedikit snarky tapi helpful. 
Jawab dalam bahasa yang sama dengan pertanyaan user (Indonesia atau English).
Kalau ada kode, gunakan markdown code blocks.
Singkat, padat, tepat. Tidak perlu basa-basi panjang.`;

// ── Model select ─────────────────────────────────────
function selectModel(el, key) {
  document.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedModel = MODELS[key];
}

// ── Textarea auto-resize ─────────────────────────────
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  charCount.textContent = input.value.length;
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Time format ──────────────────────────────────────
function fmtTime(d) {
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

// ── Render message ───────────────────────────────────
function renderMessage(role, content, time) {
  if (emptyState.style.display !== 'none') {
    emptyState.style.display = 'none';
  }

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = role === 'user' ? 'kamu' : 'KaiAI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatContent(content);

  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time';
  timeEl.textContent = fmtTime(time);

  row.appendChild(sender);
  row.appendChild(bubble);
  row.appendChild(timeEl);
  chatEl.appendChild(row);

  scrollToBottom();
  return row;
}

function formatContent(text) {
  // code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escHtml(code.trim())}</code></pre>`
  );
  // inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // newlines
  text = text.replace(/\n/g, '<br/>');
  return text;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Typing indicator ─────────────────────────────────
function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.id = 'typingRow';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = 'KaiAI';

  const tb = document.createElement('div');
  tb.className = 'typing-bubble';
  tb.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

  row.appendChild(sender);
  row.appendChild(tb);
  chatEl.appendChild(row);
  scrollToBottom();
  typingEl = row;
}

function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function scrollToBottom() {
  chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' });
}

// ── Send message ─────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  // Clear input
  input.value = '';
  input.style.height = 'auto';
  charCount.textContent = '0';

  const now = new Date();
  messages.push({ role: 'user', content: text });
  renderMessage('user', text, now);

  isLoading = true;
  sendBtn.disabled = true;
  aiStatus.textContent = 'typing...';
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedModel,
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages.map(m => ({ role: m.role, content: m.content }))
      })
    });

    const data = await response.json();
    hideTyping();

    if (data.error) throw new Error(data.error.message);

    const reply = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('');

    messages.push({ role: 'assistant', content: reply });
    renderMessage('ai', reply, new Date());
    aiStatus.textContent = 'online · ready';

  } catch (err) {
    hideTyping();
    renderMessage('ai', `⚠ Error: ${err.message || 'Gagal menghubungi API.'}`, new Date());
    aiStatus.textContent = 'error · retry';
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}

// ── Suggestion chips ─────────────────────────────────
function useSuggestion(el) {
  input.value = el.textContent;
  charCount.textContent = input.value.length;
  input.focus();
  sendMessage();
}

// ── Clear chat ───────────────────────────────────────
function showClearConfirm() {
  document.getElementById('clearConfirm').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function hideClearConfirm() {
  document.getElementById('clearConfirm').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}
function clearChat() {
  messages = [];
  chatEl.innerHTML = '';
  chatEl.appendChild(emptyState);
  emptyState.style.display = '';
  hideClearConfirm();
  aiStatus.textContent = 'online · ready';
}

// ── Export chat ──────────────────────────────────────
function exportChat() {
  if (messages.length === 0) return;
  const lines = messages.map(m =>
    `[${m.role === 'user' ? 'Kamu' : 'KaiAI'}]\n${m.content}\n`
  );
  const blob = new Blob(['KaiAI Chat Export\n' + new Date().toLocaleString() + '\n\n' + lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kaiAI-chat-${Date.now()}.txt`;
  a.click();
}

// Init: hide empty state if needed
emptyState.style.display = '';
</script>
</body>
</html>
